[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "techmind"
version = "1.1.0"
description = "Clasificador NLP de contenido técnico para backend, cloud, datascience y frontend."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

keywords = [
    "machine-learning",
    "nlp",
    "text-classification",
    "fastapi",
    "scikit-learn",
    "techmind"
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.12,<2",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1"
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "techmind",
    "techmind_api"
]
exclude = [
    "techmind_v12*",
    "techmind_api_v12*",
    "tests*",
    "notebooks*",
    "data*",
    "docs*",
    "reports*",
    "monitoring*",
    "deployment*",
    "deploy*",
    "examples*"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = [
    "test_*.py"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
